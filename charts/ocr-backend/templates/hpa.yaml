{{- /* Requires metrics-server (check: kubectl top pod -n <ns>). */ -}}
{{- range $component := list "api" "worker" }}
{{- $hpa := index $.Values.autoscaling $component }}
{{- if $hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "ocr-backend.fullname" $ }}-{{ $component }}
  labels:
    {{- include "ocr-backend.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "ocr-backend.fullname" $ }}-{{ $component }}
  minReplicas: {{ $hpa.minReplicas }}
  maxReplicas: {{ $hpa.maxReplicas }}
  metrics:
    {{- with $hpa.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
    {{- with $hpa.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: {{ $hpa.scaleDownStabilizationSeconds }}
      policies:
        # One pod at a time, so a load dip never drops several replicas at once.
        - type: Pods
          value: 1
          periodSeconds: 60
{{- end }}
{{- end }}
