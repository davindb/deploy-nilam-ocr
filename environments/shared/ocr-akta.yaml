# shared overrides for charts/ocr-akta, all five akta services (one release each; the deploy script picks one with
# --set component=<service>). image.*, component and existingSecret come from environments/shared.env via the
# scripts. Namespace bribrain-ocr-nilam (the nilam quota is used up), shared with NPWP and SPR. Pods land on the
# untainted pool, Services stay ClusterIP like the other nilam services, and APM goes to the namespace APM
# server (apm below).
#
# Database: a plain DATABASE_URL (postgresql+asyncpg://<user>:<password>@<private ip>:5432/<db>, schema
# nilam_ocr_akta) in the akta Secret, no Cloud SQL connector. The akta tables must exist before the first deploy.
# Model weights are baked into the images: the pods need no GCS access and no GCP identity.

commonEnv:
  # Load tests of the ML team through kubectl port-forward to the orchestrator (/v1/extract-ocr-test).
  TESTING_ENDPOINTS: "true"
  # Hosts of the presigned MinIO URLs downloaded by the orchestrator and again by extraction (file_url); empty =
  # only public addresses, and minio.dev.bri.co.id resolves to a private one. Same list as KK next door.
  FILE_URL_ALLOWED_HOSTS: minio.dev.bri.co.id,34.101.120.81

# Elastic APM of this namespace, the stack NPWP, SK kerja and slip gaji already send to (its NetworkPolicy admits
# every pod of the namespace). serviceName empty = one per Deployment (ms-bribrain-nilam-ocr-akta-<service>), as
# NPWP; environment dev, as the others. ELASTIC_APM_SECRET_TOKEN goes into the akta Secret (README, "Secret
# aplikasi akta"), never here; without it the APM server answers 401 and the services run on, sending nothing.
# Body, headers and local variables stay off (pinned by the chart).
apm:
  serverUrl: http://ms-bribrain-nilam-elastic-apm-server.bribrain-ocr-nilam.svc.cluster.local:8200
  serviceName: ""
  environment: dev

# Callback mode, as NPWP and SK kerja on this cluster: the central orchestrator (ocr-backend, same namespace) has
# OCR_AKTA_PENDIRIAN_RESULT_MODE=callback and waits for POST /v1/ocr-callback on every request answered 202.
# ORCHESTRATION_CALLBACK_KEY in the akta Secret = OCR_CALLBACK_SECRET of the Secret ocr-orchestration.
orchestration:
  callbackEnabled: true
  url: http://ms-bribrain-nilam-ocr-orchestrator.bribrain-ocr-nilam.svc.cluster.local

# Object names = Bitbucket repo = Nexus image (deployment guide 4.5), like ms-bribrain-nilam-ocr-npwp-* next door.
# HPA off and one replica each, like the other services of this namespace. Total requests 2.75 CPU / 11Gi
# (see charts/ocr-akta/values.yaml), within the namespace quota raised on 2026-10-23.
# maxSurge 0: a rollout never reserves a pod above the share; the service is down while the new pod starts.
# CPU limit = request here only: the namespace ResourceQuota (resource-bribrain-ocr-nilam) counts limits.cpu and
# rejects any pod without one ("must specify limits.cpu"). The chart default stays without a CPU limit.
services:
  orchestrator:
    fullnameOverride: ms-bribrain-nilam-ocr-akta-orchestrator
    strategy: &stopThenStart
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
    resources:
      limits:
        cpu: 250m
  extraction:
    fullnameOverride: ms-bribrain-nilam-ocr-akta-extraction
    strategy: *stopThenStart
    resources:
      limits:
        cpu: "1"
    # The API key of the PP-StructureV3 service of this namespace, from its own Secret (owned by the Paddle team).
    externalSecretEnv:
      - name: PADDLE_API_KEY
        secret: ms-bribrain-nilam-ocr-paddle-ppstructure-v3-secret
    env:
      # PaddleOCR PP-StructureV3, the engine of the corpus and every akta model, inside this cluster (10.213.191.187:5000
      # is not reachable from the pods). NOT PP-OCRv6 (NPWP). End-to-end passed here on 2026-10-27.
      EXTRACTION_OCR_URL: http://ms-bribrain-nilam-ocr-paddle-ppstructure-v3-service.bribrain-ocr-nilam.svc.cluster.local/ocr
      EXTRACTION_OCR_HEADERS: '{"X-API-Key": "$(PADDLE_API_KEY)"}'
  guardrails:
    fullnameOverride: ms-bribrain-nilam-ocr-akta-guardrails
    strategy: *stopThenStart
    resources:
      limits:
        cpu: "1"
  structuring:
    fullnameOverride: ms-bribrain-nilam-ocr-akta-structuring
    strategy: *stopThenStart
    resources:
      limits:
        cpu: "1"
    env:
      # FILL IN before the first deploy (structuring refuses to start without them): not secrets, the same values
      # as the services/structuring/.env that already runs on the VM. LLM_AUTH_CLIENT_SECRET is in the Secret.
      # Egress to the identity provider and the LLM region (ap-southeast-3) must be open from this cluster.
      # The cluster has no direct internet: Entra ID, STS and Bedrock go through the BRI egress proxy (requests and
      # boto3 read HTTPS_PROXY), as for slip gaji. The proxy refuses bedrock-runtime and passes bedrock-mantle, so the
      # model answers through Mantle (needs the image with the Mantle fallback). NO_PROXY keeps the Service calls, DB,
      # Redis and GCS (Private Google Access) direct.
      # Prompt cache on the central orchestrator's Redis (nilam-ocr-redis, user nilam-ocr: ocr:* only), as SPR
      # (ocr:prompt:spr), SHM and mutasi. CACHE_URL is in the Secret. Needs the image 6aa982d or later.
      STRUCTURING_PROMPT_REDIS_KEY: ocr:prompt:akta
      HTTPS_PROXY: http://10.213.196.4:1707
      NO_PROXY: localhost,127.0.0.1,.svc,.cluster.local,ms-bribrain-nilam-ocr-akta-scoring,10.213.193.3,169.254.169.254,metadata.google.internal,.googleapis.com
      LLM_AUTH_TENANT_ID: "76795979-244b-45d7-b043-ae27e60f46ee"
      LLM_AUTH_CLIENT_ID: "5d46930c-300f-434f-aa2a-059811315624"
      LLM_AUTH_BRIDGE_ROLE: "arn:aws:iam::061039788626:role/aw-alia-dev-irl-bridge-dai"
      LLM_AUTH_TARGET_ROLE: "arn:aws:iam::690081480327:role/aw-alia-dev-irl-bedrock-oidc"
  scoring:
    fullnameOverride: ms-bribrain-nilam-ocr-akta-scoring
    strategy: *stopThenStart
    resources:
      limits:
        cpu: 250m
